apiVersion: v1
kind: Namespace
metadata:
  name: migration-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-controller
  namespace: migration-system
  labels:
    app: migration-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migration-controller
  template:
    metadata:
      labels:
        app: migration-controller
    spec:
      serviceAccountName: migration-controller
      containers:
      - name: controller
        image: REGISTRY/CONTROLLER_IMAGE
        imagePullPolicy: Always
        env:
        - name: AGENT_IMAGE
          value: "REGISTRY/AGENT_IMAGE"
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  namespace: migration-system
  labels:
    app: node-monitor
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      serviceAccountName: migration-controller
      hostNetwork: true
      containers:
      - name: monitor
        image: REGISTRY/MONITOR_IMAGE
        imagePullPolicy: Always
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args:
        - --cloud-type=aws  # Change to gcp or azure as needed
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
