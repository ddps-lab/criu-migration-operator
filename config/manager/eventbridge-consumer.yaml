apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventbridge-consumer
  namespace: migration-system
  labels:
    app: eventbridge-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventbridge-consumer
  template:
    metadata:
      labels:
        app: eventbridge-consumer
    spec:
      serviceAccountName: migration-controller
      tolerations:
      - key: "capacity-type"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
      containers:
      - name: consumer
        image: 786382940258.dkr.ecr.us-east-1.amazonaws.com/criu-eventbridge-consumer:jglee-phase4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEBHOOK_PORT
          value: "8080"
        - name: WEBHOOK_PATH
          value: "/webhook"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: eventbridge-consumer
  namespace: migration-system
  labels:
    app: eventbridge-consumer
spec:
  type: LoadBalancer
  selector:
    app: eventbridge-consumer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
