apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: migration-pod-injector
webhooks:
- name: pod-injector.migration.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: migration-webhook
      namespace: migration-system
      path: /mutate-v1-pod
      port: 443
    # caBundle is injected by cert setup (cert-manager or manual)
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "Namespaced"
  objectSelector:
    matchExpressions:
    - key: migration.io/injected
      operator: DoesNotExist
  failurePolicy: Ignore
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10
  reinvocationPolicy: IfNeeded
