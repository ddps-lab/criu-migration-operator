apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-controller
  namespace: migration-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: migration-controller-role
rules:
# MigratableApp resources
- apiGroups:
  - migration.io
  resources:
  - migratableapps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - migration.io
  resources:
  - migratableapps/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - migration.io
  resources:
  - migratableapps/finalizers
  verbs:
  - update

# Pod resources
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Node resources (for node monitor)
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
  - update
  - patch

# Events for recording
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: migration-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: migration-controller-role
subjects:
- kind: ServiceAccount
  name: migration-controller
  namespace: migration-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migration-leader-election-role
  namespace: migration-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: migration-leader-election-rolebinding
  namespace: migration-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: migration-leader-election-role
subjects:
- kind: ServiceAccount
  name: migration-controller
  namespace: migration-system
